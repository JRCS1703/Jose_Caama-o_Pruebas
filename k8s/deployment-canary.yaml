apiVersion: apps/v1
kind: Deployment
metadata:
  name: ta7-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ta7
      track: canary
  template:
    metadata:
      labels:
        app: ta7
        track: canary
    spec:
      containers:
        - name: app
          image: ghcr.io/jrcs1703/ta7-automation:1.1.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
