name: CI-CD Automatizacion de Pruebas

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven package
        run: mvn -B -DskipTests package

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        run: mvn -B test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run integration tests
        run: mvn -B verify

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run acceptance gate
        run: mvn -B -Dtest=PurchaseFlowAT test

  deploy-staging:
    name: Blue-Green Deploy and Rollback Drill
    runs-on: ubuntu-latest
    needs: acceptance-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare scripts
        run: chmod +x scripts/*.sh
      - name: Deploy candidate to Green
        run: ./scripts/deploy-blue-green.sh green
      - name: Verify Green is active
        run: test "$(cat deployment/active_environment.txt)" = "green"
      - name: Rollback drill to Blue
        run: ./scripts/rollback.sh blue
      - name: Verify Blue after rollback
        run: test "$(cat deployment/active_environment.txt)" = "blue"
      - name: Show evidence log
        run: cat deployment/evidence/deployment.log
      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: deployment/evidence/deployment.log
          if-no-files-found: error
