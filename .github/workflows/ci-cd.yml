name: CI-CD TA7

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build + unit tests
        run: mvn -B clean test

      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Package application
        run: mvn -B -DskipTests package

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build staging artifact
        run: mvn -B -DskipTests package

      - name: Deploy staging
        run: bash scripts/deploy-staging.sh

      - name: Acceptance tests against staging
        env:
          BASE_URL: http://127.0.0.1:8080
        run: mvn -B failsafe:integration-test failsafe:verify

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-and-acceptance-logs
          path: |
            logs/
            target/failsafe-reports/

  canary-and-rollback:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build release artifact
        run: mvn -B -DskipTests package

      - name: Deploy stable environment
        run: bash scripts/deploy-staging.sh

      - name: Deploy Canary at 10 percent
        run: bash scripts/deploy-canary.sh

      - name: Validate Canary health
        run: |
          curl --fail --silent http://127.0.0.1:8081/actuator/health | tee -a logs/canary.log
          echo >> logs/canary.log
          echo "PROMOTION_DECISION=CANARY_HEALTHY" | tee -a logs/canary.log

      - name: Validate rollback procedure
        run: bash scripts/rollback.sh

      - name: Upload Canary and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-rollback-logs
          path: logs/
